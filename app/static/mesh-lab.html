<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Securo — مركز العمليات الحي</title>
<link rel="stylesheet" href="/mesh-lab.css">
</head>
<body>

<div class="stage">
  <canvas id="p3d"></canvas>
  <div class="overlay" id="p3dOv"></div>

  <div class="hud hud-top">
    <div class="brand">
      <span class="brand-dot"></span>
      <strong>SECURO</strong><span class="brand-sub">مركز العمليات الحي</span>
    </div>
    <div class="top-actions">
      <span class="conn off" id="conn">جاري الاتصال…</span>
      <button class="btn run" id="run">تشغيل فحص حقيقي</button>
      <button class="btn ghost" id="demo">عرض توضيحي</button>
    </div>
  </div>

  <div class="hud hud-stats" id="rd">
    <div class="stat"><span class="stat-l">مؤشر الصحة</span><b id="m0">—</b><div class="stat-bar"><div class="stat-fill" id="f0"></div></div></div>
    <div class="stat"><span class="stat-l">عناصر عاجلة</span><b id="m1">—</b></div>
    <div class="stat"><span class="stat-l">إجمالي النتائج</span><b id="m2">—</b></div>
    <div class="stat"><span class="stat-l">الوكيل النشط</span><b id="m3">—</b></div>
  </div>

  <div class="hud agent-card" id="card" hidden>
    <button class="card-x" id="cardX">×</button>
    <h3 id="cardName">—</h3>
    <p id="cardDesc">—</p>
    <div class="card-row"><span>الحالة</span><b id="cardState">—</b></div>
  </div>

  <div class="hud hud-log"><span class="log-tick"></span><div id="lg">—</div></div>

  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="scanline"></div>
</div>

<script type="module" src="/pipeline3d.js"></script>
</body>
</html>
